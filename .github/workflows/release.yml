name: Build release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to build and release
        required: true
        type: string
      tag:
        description: Release tag to create (for example, v0.1.0-alpha.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, validate, and build
        run: |
          npm ci
          npm run lint
          npm run test:audio
          npm run build

      - name: Assemble release files
        run: |
          npx tsx scripts/build-release.ts
          VERSION=$(node -p "require('./package.json').version")
          cd release
          zip -r "../SwissMouse-${VERSION}.zip" "SwissMouse-${VERSION}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSET="SwissMouse-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$COMMIT" --title "SwissMouse $VERSION" --prerelease --generate-notes
          fi
