name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v0.1.0-alpha.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm run test:audio

      - name: Build application
        run: npm run build

      - name: Assemble release files
        run: |
          npx tsx scripts/build-release.ts
          VERSION=$(node -p "require('./package.json').version")
          cd release
          zip -r "../SwissMouse-${VERSION}.zip" "SwissMouse-${VERSION}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSET="SwissMouse-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "SwissMouse $VERSION" --prerelease --generate-notes
          fi
