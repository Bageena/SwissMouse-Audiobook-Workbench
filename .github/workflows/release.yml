name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (v0.1.0-alpha.5)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const l=JSON.parse(fs.readFileSync("package-lock.json")); if(process.env.RELEASE_TAG!==`v${p.version}` || l.version!==p.version || l.packages[""].version!==p.version) throw new Error("Release tag, package version and lockfile must match");'
          EXISTING=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [ -n "$EXISTING" ]; then
            TARGET=$(printf '%s\n' "$EXISTING" | tail -1 | cut -f1)
            test "$TARGET" = "$GITHUB_SHA" || { echo 'Existing tag points to a different commit'; exit 1; }
          fi

      - name: Prepare audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          mkdir -p .cache audio-test-reference
          curl --fail --location https://raw.githubusercontent.com/advplyr/audiobookshelf/64e9ac9d8f27353f9f588cb4c70cb5b0b6b2989c/server/utils/prober.js --output audio-test-reference/prober.cjs
          echo "91ce699b6d7927491e508c6d0dd30f25f7179506ef58503a1d25c653fde1a3fa  audio-test-reference/prober.cjs" | sha256sum --check -

      - name: Install dependencies
        run: npm ci

      - name: Audit public source files
        run: node scripts/audit-release.mjs

      - name: Type-check
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run tests
        env:
          TEST_FFMPEG: /usr/bin/ffmpeg
          TEST_FFPROBE: /usr/bin/ffprobe
        run: npm run test:audio

      - name: Assemble release files
        run: |
          npx tsx scripts/build-release.ts
          VERSION=$(node -p "require('./package.json').version")
          node scripts/audit-release.mjs "release/SwissMouse-${VERSION}"
          cd release
          zip -r "../SwissMouse-${VERSION}.zip" "SwissMouse-${VERSION}"

      - name: Smoke test isolated production release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SMOKE_ROOT=$(mktemp -d)
          cp -a "release/SwissMouse-${VERSION}/." "$SMOKE_ROOT/"
          npm ci --omit=dev --prefix "$SMOKE_ROOT"
          node scripts/smoke-release.mjs "$SMOKE_ROOT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSET="SwissMouse-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "SwissMouse $VERSION" --prerelease --notes-file docs/releases/alpha5.md
          fi
