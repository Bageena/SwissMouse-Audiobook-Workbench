<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <title>Paper boat with mouse ears — Polaroid image icon</title>
  <g stroke="#494236" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="1" width="30" height="34" rx=".6" fill="#fff9ed" stroke-width="1.3"/>
    <path d="M6 4h24v22H6Z" fill="#dce4d3" stroke="#7e806e" stroke-width=".9"/>
    <g transform="translate(2.2 1.5) scale(.88)">
