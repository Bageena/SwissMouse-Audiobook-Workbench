    <path d="m16.3 9.4.3 8.7h4.1Z" fill="#dfcda6" stroke-width=".7"/>
    <path d="m7.5 17.4 10.4 2.5 10.6-2.5-4.9 7.1H12.4Z" fill="#fff5dd" stroke-width="1.1"/>
    <path d="m17.9 19.9 5.7 4.6 4.9-7.1Z" fill="#e4cea3" stroke-width=".7"/>
    <path d="m12.4 24.5 5.5-4.6" stroke="#a79575" stroke-width=".7"/>
    <path d="M9 26h5m9 0h3" stroke="#7e9e9a" stroke-width=".7"/>
    </g>
  </g>
</svg>
