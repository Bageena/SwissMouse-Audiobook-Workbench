    <circle cx="25" cy="12.5" r="2.7" fill="#8d877c" stroke-width=".9"/>
    <path d="M19.3 17.9v-2.2a3.4 3.4 0 0 1 6.8 0v2.2Z" fill="#8d877c" stroke-width=".9"/>
