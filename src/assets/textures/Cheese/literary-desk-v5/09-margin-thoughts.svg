<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="4608" viewBox="0 0 1024 4608"><g fill="#65523c" font-family="Segoe Print, Bradley Hand, cursive" font-size="19"><g transform="translate(64 112) rotate(-4)"><text><tspan x="0" dy="0">One more chapter.</tspan><tspan x="0" dy="29">Then we negotiate.</tspan></text><path d="M4 42q55 8 128 0" fill="none" stroke="#8a7150" stroke-width="1.2" opacity=".45"/></g><g transform="translate(590 297) rotate(3)"><text><tspan x="0" dy="0">A small door can open</tspan><tspan x="0" dy="29">a very large world.</tspan></text></g><g transform="translate(64 482) rotate(-1)"><text><tspan x="0" dy="0">Plot twist:</tspan><tspan x="0" dy="29">the tea went cold.</tspan></text></g><g transform="translate(590 667) rotate(-4)"><text><tspan x="0" dy="0">Rest is part</tspan><tspan x="0" dy="29">of the rhythm.</tspan></text></g><g transform="translate(64 852) rotate(3)"><text><tspan x="0" dy="0">Not lost.</tspan><tspan x="0" dy="29">Reading the footnotes.</tspan></text><path d="M4 42q55 8 128 0" fill="none" stroke="#8a7150" stroke-width="1.2" opacity=".45"/></g><g transform="translate(590 1037) rotate(-1)"><text><tspan x="0" dy="0">What if curiosity</tspan><tspan x="0" dy="29">is a kind of courage?</tspan></text></g><g transform="translate(64 1222) rotate(-4)"><text><tspan x="0" dy="0">Here be dragons.</tspan><tspan x="0" dy="29">Please bring biscuits.</tspan></text></g><g transform="translate(590 1407) rotate(3)"><text><tspan x="0" dy="0">The map is useful.</tspan><tspan x="0" dy="29">The detour is yours.</tspan></text></g><g transform="translate(64 1592) rotate(-1)"><text><tspan x="0" dy="0">A bookmark is a promise</tspan><tspan x="0" dy="29">to your future self.</tspan></text><path d="M4 42q55 8 128 0" fill="none" stroke="#8a7150" stroke-width="1.2" opacity=".45"/></g><g transform="translate(590 1777) rotate(-4)"><text><tspan x="0" dy="0">Even the moon</tspan><tspan x="0" dy="29">has unfinished phases.</tspan></text></g><g transform="translate(64 1962) rotate(3)"><text><tspan x="0" dy="0">Today’s grand quest:</tspan><tspan x="0" dy="29">find the other sock.</tspan></text></g><g transform="translate(590 2147) rotate(-1)"><text><tspan x="0" dy="0">Quiet is not empty.</tspan><tspan x="0" dy="29">Listen a little longer.</tspan></text></g><g transform="translate(64 2332) rotate(-4)"><text><tspan x="0" dy="0">42.</tspan><tspan x="0" dy="29">Still checking the question.</tspan></text><path d="M4 42q55 8 128 0" fill="none" stroke="#8a7150" stroke-width="1.2" opacity=".45"/></g><g transform="translate(590 2517) rotate(3)"><text><tspan x="0" dy="0">Some doors open</tspan><tspan x="0" dy="29">when you stop pushing.</tspan></text></g><g transform="translate(64 2702) rotate(-1)"><text><tspan x="0" dy="0">If in doubt,</tspan><tspan x="0" dy="29">consult the mouse.</tspan></text></g><g transform="translate(590 2887) rotate(-4)"><text><tspan x="0" dy="0">The cheese was real.</tspan><tspan x="0" dy="29">The deadline was imaginary.</tspan></text></g><g transform="translate(64 3072) rotate(3)"><text><tspan x="0" dy="0">A chapter ends.</tspan><tspan x="0" dy="29">The story carries on.</tspan></text><path d="M4 42q55 8 128 0" fill="none" stroke="#8a7150" stroke-width="1.2" opacity=".45"/></g><g transform="translate(590 3257) rotate(-1)"><text><tspan x="0" dy="0">Leave room</tspan><tspan x="0" dy="29">for a different ending.</tspan></text></g><g transform="translate(64 3442) rotate(-4)"><text><tspan x="0" dy="0">Tiny steps still</tspan><tspan x="0" dy="29">change the view.</tspan></text></g><g transform="translate(590 3627) rotate(3)"><text><tspan x="0" dy="0">I came. I saw.</tspan><tspan x="0" dy="29">I made more tea.</tspan></text></g><g transform="translate(64 3812) rotate(-1)"><text><tspan x="0" dy="0">You can turn the page</tspan><tspan x="0" dy="29">without burning the book.</tspan></text><path d="M4 42q55 8 128 0" fill="none" stroke="#8a7150" stroke-width="1.2" opacity=".45"/></g><g transform="translate(590 3997) rotate(-4)"><text><tspan x="0" dy="0">Wonder is a habit</tspan><tspan x="0" dy="29">worth keeping.</tspan></text></g><g transform="translate(64 4182) rotate(3)"><text><tspan x="0" dy="0">The dragon also</tspan><tspan x="0" dy="29">needs a nap.</tspan></text></g><g transform="translate(590 4367) rotate(-1)"><text><tspan x="0" dy="0">Progress, with crumbs.</tspan></text></g></g></svg>